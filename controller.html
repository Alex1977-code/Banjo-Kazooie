<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2a1a4a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <title>Bruno & Kiki – Handy-Controller</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: radial-gradient(circle at 50% 30%, #3b2a6a, #120a20); }
    #connect {
      position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 20px; text-align: center; z-index: 30;
    }
    #connect input {
      font-family: 'LuckiestGuy', Impact, sans-serif; font-size: 44px; letter-spacing: 12px; width: 240px; text-align: center;
      border-radius: 16px; border: 4px solid #3a1c00; padding: 10px 6px 4px; background: #fff8e0; color: #3a1c00;
    }
    #status { font-size: 17px; min-height: 1.4em; }
    #pad { position: absolute; inset: 0; }
    #pad .tbtn { opacity: 0.95; }
    #pad .tbtn-a { width: 110px; height: 110px; }
    #pad .tbtn-b { width: 86px; height: 86px; right: calc(140px + var(--safe-r)); bottom: calc(110px + var(--safe-b)); }
    #pad .tbtn-z { width: 78px; height: 78px; right: calc(152px + var(--safe-r)); bottom: calc(14px + var(--safe-b)); }
    #pad .tbtn-cam { bottom: calc(150px + var(--safe-b)); }
    .ctl-info {
      position: absolute; top: calc(10px + var(--safe-t)); left: 50%; transform: translateX(-50%);
      font-size: 14px; opacity: 0.85; text-align: center; pointer-events: none; z-index: 25;
    }
    .ctl-info b { color: var(--gold); }
    #connect .logo { font-size: clamp(36px, 9vw, 70px); }
  </style>
</head>
<body>
  <div id="app">
    <div id="pad" hidden>
      <div class="ctl-info">Handy-Controller <b id="code-label"></b> · rechts wischen = Kamera</div>
      <div id="touch"></div>
    </div>
    <div id="connect">
      <div class="logo">Bruno <em>&amp;</em> Kiki</div>
      <div class="subtitle">Handy-Controller</div>
      <input id="code" inputmode="numeric" maxlength="4" placeholder="Code" autocomplete="off">
      <button class="mbtn" id="go">Verbinden</button>
      <div id="status">Gib den Code vom Fernseher ein.</div>
    </div>
    <div id="rotate-hint">
      <div class="phone-icon"></div>
      <p>Bitte das Handy quer halten</p>
    </div>
  </div>
  <script type="module" src="src/controller.js"></script>
</body>
</html>
